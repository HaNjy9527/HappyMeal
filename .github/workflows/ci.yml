name: HappyMeal CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run frontend build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t happymeal-backend-ci ./backend

      - name: Build frontend image
        run: docker build -t happymeal-frontend-ci ./frontend

  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, docker-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Install AWS Lightsail plugin
        run: |
          curl "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" -o "/usr/local/bin/lightsailctl"
          chmod +x /usr/local/bin/lightsailctl

      - name: Build Docker image
        run: docker build -t happymeal-backend ./backend

      - name: Push image to Lightsail
        run: |
          aws lightsail push-container-image \
            --service-name happymeal-backend \
            --label app \
            --image happymeal-backend

      - name: Deploy to Lightsail Container Service
        run: |
          IMAGE=$(aws lightsail get-container-images \
            --service-name happymeal-backend \
            --query 'containerImages[0].image' \
            --output text)

          aws lightsail create-container-service-deployment \
            --service-name happymeal-backend \
            --containers "{
              \"app\": {
                \"image\": \"$IMAGE\",
                \"environment\": {
                  "APP_ENV": "production",
                  \"CORS_ALLOW_ORIGINS\": \"${{ secrets.CORS_ALLOW_ORIGINS }}\",
                  \"DATABASE_URL\": \"${{ secrets.DATABASE_URL }}\",
                  \"LINE_CHANNEL_ID\": \"${{ secrets.LINE_CHANNEL_ID }}\",
                  \"LINE_CHANNEL_SECRET\": \"${{ secrets.LINE_CHANNEL_SECRET }}\",
                  "LINE_CALLBACK_URL": "${{ secrets.LINE_CALLBACK_URL }}",
                  "SESSION_SECRET_KEY": "${{ secrets.SESSION_SECRET_KEY }}",
                  "FRONTEND_URL": "${{ secrets.FRONTEND_URL }}",
                  "AI_API_KEY": "${{ secrets.AI_API_KEY }}",
                  "NUTRITION_DATA_SOURCE": "${{ secrets.NUTRITION_DATA_SOURCE }}"
                },
                \"ports\": { \"8000\": \"HTTP\" }
              }
            }" \
            --public-endpoint '{
              "containerName": "app",
              "containerPort": 8000,
              "healthCheck": {
                "path": "/health",
                "intervalSeconds": 10,
                "timeoutSeconds": 5,
                "successCodes": "200"
              }
            }'
